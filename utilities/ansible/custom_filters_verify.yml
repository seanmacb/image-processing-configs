---
# Verifies that the filters applied by custom_filters.yml are actually
# registered and usable - not just present in the edited source files. Read
# only, safe to re-run any time after custom_filters.yml has run:
#   ansible-playbook custom_filters_verify.yml
- name: Verify custom DECam filter registration
  hosts: lsst_servers
  gather_facts: true

  tasks:
    - name: Load lsst_prepare_env's default vars (for lsst_prepare_env_script_name), without running its tasks
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/roles/lsst_prepare_env/defaults/main.yml"

    - name: Run lsst_custom_filters verification tasks
      ansible.builtin.include_role:
        name: lsst_custom_filters
        tasks_from: verify
