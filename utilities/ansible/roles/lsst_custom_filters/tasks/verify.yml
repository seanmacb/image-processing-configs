---
# Verifies that the filters listed in lsst_custom_filters (defaults/main.yml)
# are actually registered end-to-end, not just present in the edited source
# files. Read-only: every task here is changed_when: false. Run standalone
# via custom_filters_verify.yml, any time after custom_filters.yml has run.

- name: Verify custom filters are present in obs_decam's DarkEnergyCamera.filterDefinitions
  ansible.builtin.shell: |
    set -eo pipefail
    source "{{ lsst_install_dir }}/lsst_stack/loadLSST.sh"
    setup lsst_distrib
    setup -j -r "{{ lsst_custom_filters_obs_decam_dir }}"
    python3 <<'PYEOF'
    from lsst.obs.decam import DarkEnergyCamera

    # set(list(...)) rather than a {...} literal so this is still a set (not
    # an empty dict) when lsst_custom_filters is empty.
    expected = set([
    {% for f in lsst_custom_filters %}
        ("{{ f.physical_filter }}", "{{ f.band }}"),
    {% endfor %}
    ])
    found = {(fd.physical_filter, fd.band) for fd in DarkEnergyCamera.filterDefinitions}
    missing = expected - found
    if missing:
        raise SystemExit(f"Missing from DarkEnergyCamera.filterDefinitions: {missing}")
    print("obs_decam: all custom filters present")
    PYEOF
  args:
    executable: /bin/bash
  changed_when: false

# Actually execs filterMap.py (catching syntax errors and dead/commented-out
# entries) and inspects the resulting config.filterMap dict, rather than
# grepping for the literal string blockinfile just wrote - a grep can't tell
# a live mapping from a broken or commented-out one.
- name: Verify custom band-to-refcat mappings are present in obs_decam config/filterMap.py
  ansible.builtin.shell: |
    set -eo pipefail
    source "{{ lsst_install_dir }}/lsst_stack/loadLSST.sh"
    setup lsst_distrib
    python3 <<'PYEOF'
    class _Config:
        filterMap = {}

    config = _Config()
    path = "{{ lsst_custom_filters_obs_decam_dir }}/config/filterMap.py"
    with open(path) as fh:
        exec(compile(fh.read(), path, "exec"), {"config": config})

    expected = set([
    {% for f in lsst_custom_filters %}
        ("{{ f.band }}", "{{ f.filter_map_target }}"),
    {% endfor %}
    ])
    missing = expected - set(config.filterMap.items())
    if missing:
        raise SystemExit(f"Missing from config.filterMap: {missing}")
    print("obs_decam: filterMap correctly maps all custom bands")
    PYEOF
  args:
    executable: /bin/bash
  changed_when: false

- name: Verify custom bands are present in skymap SUPPORTED_FILTERS
  ansible.builtin.shell: |
    set -eo pipefail
    source "{{ lsst_install_dir }}/lsst_stack/loadLSST.sh"
    setup lsst_distrib
    setup -j -r "{{ lsst_custom_filters_skymap_dir }}"
    python3 <<'PYEOF'
    from lsst.skymap.packers import SkyMapDimensionPacker

    expected = set([
    {% for f in lsst_custom_filters %}
        "{{ f.band }}",
    {% endfor %}
    ])
    missing = expected - set(SkyMapDimensionPacker.SUPPORTED_FILTERS)
    if missing:
        raise SystemExit(f"Missing from SkyMapDimensionPacker.SUPPORTED_FILTERS: {missing}")
    print("skymap: all custom bands present")
    PYEOF
  args:
    executable: /bin/bash
  changed_when: false

- name: Verify obs_decam and skymap LOCAL checkouts are picked up by the generated setup_env.sh
  ansible.builtin.shell: |
    set -eo pipefail
    source "{{ lsst_install_dir }}/{{ lsst_prepare_env_script_name }}"
    eups list obs_decam | grep -q LOCAL
    eups list skymap | grep -q LOCAL
  args:
    executable: /bin/bash
  changed_when: false

# This is the actual downstream mechanism analysis butler repos depend on:
# `register-instrument` is what copies filter definitions from code into a
# butler registry's physical_filter/band dimension records. Using a
# throwaway repo here proves that mechanism works for our custom filters
# without touching any real (shared) butler repo - this project doesn't
# manage any, see README "Not included". Runs the same standalone script
# custom_filters.yml wrote to lsst_install_dir/testing, so users can run
# this exact check themselves without ansible.
- name: Verify custom filters are recognized by a butler registry after register-instrument
  ansible.builtin.command:
    cmd: "{{ lsst_testing_dir }}/{{ lsst_custom_filters_check_script_name }}"
  changed_when: false
