---
- name: Register custom filters in obs_decam
  ansible.builtin.include_tasks: obs_decam.yml

- name: Register custom filter bands in skymap
  ansible.builtin.include_tasks: skymap.yml

- name: Ensure testing directory exists
  ansible.builtin.file:
    path: "{{ lsst_custom_filters_testing_dir }}"
    state: directory
    group: "{{ lsst_shared_group }}"
    mode: "2775"

- name: Write standalone butler filter-registration check script
  ansible.builtin.template:
    src: check_butler_filter_registration.sh.j2
    dest: "{{ lsst_custom_filters_testing_dir }}/{{ lsst_custom_filters_check_script_name }}"
    group: "{{ lsst_shared_group }}"
    mode: "0775"

- name: Ensure the custom_filters repos are owned by the shared group
  ansible.builtin.command:
    cmd: "chgrp -R {{ lsst_shared_group }} {{ lsst_install_dir }}/repos"
  changed_when: false

- name: Ensure group read/write and setgid propagation on custom_filters repos
  ansible.builtin.shell: |
    set -euo pipefail
    chmod -R g+rwX "{{ lsst_install_dir }}/repos"
    find "{{ lsst_install_dir }}/repos" -type d -exec chmod g+s {} +
  args:
    executable: /bin/bash
  changed_when: false
