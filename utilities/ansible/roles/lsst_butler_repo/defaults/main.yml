---
# This role is deliberately independent of the other roles in this project
# (lsst_pipeline / lsst_prepare_env / lsst_custom_filters) and their
# group_vars/all.yml entries - it only needs an existing LSST stack install
# somewhere to source its activation script from, defined below via
# lsst_butler_repo_pipeline_dir rather than reusing lsst_install_dir. That
# lets this role be pointed at a differently-configured/managed install
# without any of this project's other vars needing to line up with it. Not
# part of site.yml - applied on demand via butler_repo.yml.

# Directory on the target server where the butler repo gets created. Not in
# group_vars/all.yml on purpose, see above.
lsst_butler_repo_dir: "/disk/groups/des/butler_repos/main"

# Linux group that should have shared read/write access to
# lsst_butler_repo_dir. The ansible_user for each host must already be a
# member of this group on the target host.
lsst_butler_repo_shared_group: "des"

# Directory of the LSST Science Pipelines install to source before running
# butler commands against this repo. Independent of lsst_install_dir
# (group_vars/all.yml, used by lsst_pipeline/lsst_prepare_env) - set this to
# wherever an lsst_prepare_env-generated activation script actually lives.
lsst_butler_repo_pipeline_dir: "/disk/groups/des/lsst_pipeline/v30_0_x"

# Name of the activation script (as written by lsst_prepare_env) to source
# from lsst_butler_repo_pipeline_dir.
lsst_butler_repo_prepare_env_script_name: "setup_env.sh"

# Instruments to register right after creating the repo (in this order,
# all in the same sourced shell as `butler create` - see tasks/main.yml).
# A fresh butler repo has no instrument dimension records at all, so this
# is needed before any real ingest/processing against it. Set to []
# to skip instrument registration entirely.
lsst_butler_repo_instrument_classes:
  - "lsst.obs.decam.DarkEnergyCamera"
