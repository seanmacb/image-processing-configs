---
# Independent of lsst_pipeline/lsst_prepare_env and group_vars/all.yml -
# see lsst_butler_repo_pipeline_dir below. Not part of site.yml, applied
# via butler_repo.yml.

lsst_butler_repo_dir: "/disk/gfs_grpdata/des/image_pipeline_repos/_testing/johwue/"

# ansible_user must already be a member of this group on the target host.
lsst_butler_repo_shared_group: "des"

# Install to source before running butler commands - independent of
# lsst_install_dir so this role isn't tied to the install site.yml manages.
lsst_butler_repo_pipeline_dir: "/disk/groups/des/lsst_pipeline/v30_0_x"
lsst_butler_repo_prepare_env_script_name: "setup_env.sh"

# Registered in this order right after `butler create`. Set to [] to skip.
lsst_butler_repo_instrument_classes:
  - "lsst.obs.decam.DarkEnergyCamera"

# write-curated-calibrations run for each, right after the instruments
# above. Set to [] to skip.
lsst_butler_repo_curated_calibration_instruments:
  - "lsst.obs.decam.DarkEnergyCamera"

# Registered in this order, after the curated calibrations above. Each
# needs a `name` (-c name=...) and `config` (-C ..., e.g. $OBS_DECAM_DIR/
# config/makeSkyMap.py once obs_decam is set up). Set to [] to skip.
lsst_butler_repo_skymaps:
  - name: "decam_rings_v1"
    config: "$OBS_DECAM_DIR/config/makeSkyMap.py"

# Optional Postgres registry backend - leave lsst_butler_repo_postgres_host
# empty (default) to fall back to SQLite. Only takes effect when the repo
# is actually created (registry backend can't change afterwards). No
# password var: auth comes from a ~/.pgpass file on the target host
# (set up separately) matching host/port/db/user below.
lsst_butler_repo_postgres_host: "172.23.211.243"
lsst_butler_repo_postgres_port: 5432
lsst_butler_repo_postgres_db: ""
lsst_butler_repo_postgres_user: ""
# Schema/namespace distinguishing this repo from others sharing the DB.
lsst_butler_repo_postgres_namespace: ""

# Repo activation script this role writes to lsst_butler_repo_dir (sets
# $REPO + umask; does not source the pipeline itself - see
# templates/setup_repo.sh.j2).
lsst_butler_repo_setup_script_name: "setup_repo.sh"
