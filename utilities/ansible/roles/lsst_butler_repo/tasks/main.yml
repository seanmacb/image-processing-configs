---
- name: Ensure butler repo directory exists
  ansible.builtin.file:
    path: "{{ lsst_butler_repo_dir }}"
    state: directory
    group: "{{ lsst_butler_repo_shared_group }}"
    mode: "2775"

- name: Check whether the butler repo directory is empty
  ansible.builtin.find:
    paths: "{{ lsst_butler_repo_dir }}"
    file_type: any
    hidden: true
  register: lsst_butler_repo_dir_contents

# This role only ever creates a brand new repo, never touches an existing one.
- name: Fail if the butler repo directory already has content
  ansible.builtin.fail:
    msg: >-
      {{ lsst_butler_repo_dir }} is not empty - refusing to run
      butler create/register-instrument against it. This role only
      creates brand new repos and never touches an existing one.
  when: lsst_butler_repo_dir_contents.matched > 0

- name: Create a temp file for the Postgres seed config
  ansible.builtin.tempfile:
    state: file
    suffix: .yaml
  register: lsst_butler_repo_postgres_seed_config
  when: lsst_butler_repo_postgres_host | length > 0

- name: Write the Postgres seed config for the butler repo
  ansible.builtin.template:
    src: postgres_seed_config.yaml.j2
    dest: "{{ lsst_butler_repo_postgres_seed_config.path }}"
    mode: "0600"
  when: lsst_butler_repo_postgres_host | length > 0

# Combined into one task: sourcing the pipeline env is slow and each task
# gets its own fresh shell, so splitting this up would re-pay that cost.
- name: Create the butler repo, register instruments, curated calibrations and skymaps (env sourced once)
  ansible.builtin.shell: |
    set -eo pipefail
    source "{{ lsst_butler_repo_pipeline_dir }}/{{ lsst_butler_repo_prepare_env_script_name }}"

    {% if lsst_butler_repo_postgres_host %}
    butler create "{{ lsst_butler_repo_dir }}" --seed-config "{{ lsst_butler_repo_postgres_seed_config.path }}"
    {% else %}
    butler create "{{ lsst_butler_repo_dir }}"
    {% endif %}
    {% for instrument_class in lsst_butler_repo_instrument_classes %}
    butler register-instrument "{{ lsst_butler_repo_dir }}" {{ instrument_class }} --update
    {% endfor %}
    {% for skymap in lsst_butler_repo_skymaps %}
    butler register-skymap "{{ lsst_butler_repo_dir }}" -C "{{ skymap.config }}" -c name="{{ skymap.name }}"
    {% endfor %}
    {% for calib in lsst_butler_repo_curated_calibrations %}
    butler write-curated-calibrations "{{ lsst_butler_repo_dir }}" {{ calib.instrument }} --collection {{ calib.collection }}
    {% endfor %}
  args:
    executable: /bin/bash
  changed_when: true

- name: Remove the temp Postgres seed config
  ansible.builtin.file:
    path: "{{ lsst_butler_repo_postgres_seed_config.path }}"
    state: absent
  when: lsst_butler_repo_postgres_host | length > 0

- name: Write the repo activation script
  ansible.builtin.template:
    src: setup_repo.sh.j2
    dest: "{{ lsst_butler_repo_dir }}/{{ lsst_butler_repo_setup_script_name }}"
    mode: "0664"
    group: "{{ lsst_butler_repo_shared_group }}"

- name: Ensure the butler repo is owned by the shared group
  ansible.builtin.command:
    cmd: "chgrp -R {{ lsst_butler_repo_shared_group }} {{ lsst_butler_repo_dir }}"
  changed_when: false

- name: Ensure group read/write and setgid propagation across the butler repo
  ansible.builtin.shell: |
    set -euo pipefail
    chmod -R g+rwX "{{ lsst_butler_repo_dir }}"
    find "{{ lsst_butler_repo_dir }}" -type d -exec chmod g+s {} +
  args:
    executable: /bin/bash
  changed_when: false
