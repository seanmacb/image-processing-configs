---
- name: Ensure demo_data directory exists
  ansible.builtin.file:
    path: "{{ lsst_install_dir }}/demo_data"
    state: directory
    group: "{{ lsst_shared_group }}"
    mode: "2775"

- name: Clone rc2_subset dataset and install git-lfs hooks locally (skipped if already present)
  ansible.builtin.shell: |
    set -eo pipefail
    source "{{ lsst_install_dir }}/lsst_stack/loadLSST.sh"
    setup lsst_distrib
    git clone -b {{ lsst_rc2_subset_version }} https://github.com/lsst/rc2_subset
    cd rc2_subset
    git lfs install --local
    git lfs pull
  args:
    chdir: "{{ lsst_install_dir }}/demo_data"
    executable: /bin/bash
    creates: "{{ lsst_install_dir }}/demo_data/rc2_subset"

- name: Run rc2_subset smoke test
  ansible.builtin.shell: |
    set -eo pipefail
    source "{{ lsst_install_dir }}/lsst_stack/loadLSST.sh"
    setup lsst_distrib
    setup -j -r .
    butler query-data-ids SMALL_HSC exposure,detector --collections HSC/RC2/defaults --datasets raw
    butler query-collections SMALL_HSC
    butler query-dataset-types SMALL_HSC
  args:
    chdir: "{{ lsst_install_dir }}/demo_data/rc2_subset"
    executable: /bin/bash
  changed_when: true

- name: Ensure tutorial_scripts directory exists
  ansible.builtin.file:
    path: "{{ lsst_install_dir }}/demo_data/tutorial_scripts"
    state: directory
    group: "{{ lsst_shared_group }}"
    mode: "2775"

# Runs the actual rc2_subset "Getting Started" tutorial processing steps
# (https://pipelines.lsst.io/getting-started/) - the smoke test above only
# sets up and queries the dataset, it doesn't process it. Split one script
# per tutorial step so each can be run/resubmitted individually, plus
# run_tutorial.sh to call them all in sequence. See README.md for details.
- name: Write rc2_subset tutorial step scripts
  ansible.builtin.template:
    src: "tutorial_scripts/{{ item }}.j2"
    dest: "{{ lsst_install_dir }}/demo_data/tutorial_scripts/{{ item }}"
    mode: "0775"
    group: "{{ lsst_shared_group }}"
  loop:
    - common.sh
    - run_tutorial.sh
    - 01_single_frame.sh
    - 02_uber_cal.sh
    - 03_make_warps.sh
    - 04_coadds.sh
    - 05_coadd_measurement.sh
    - 06_forced_photometry.sh
    - 07_multiband_plot.py
    - 07_multiband_plot.sh
