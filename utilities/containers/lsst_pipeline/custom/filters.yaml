# Custom filter definitions baked into the image by lsst_pipeline.def via
# apply_custom_filters.py. Kept as a standalone file (not templated from
# ansible) since apptainer def-file templating can't express a loop over a
# list the way Jinja2 can.
#
# Mirrors utilities/ansible/roles/lsst_custom_filters/defaults/main.yml's
# lsst_custom_filters list. NOT auto-synced - if that list changes, update
# this file by hand too (or, once this container approach is validated,
# replace the ansible role entirely and delete this duplication).
- physical_filter: "N395 DECam c0015 3950.0 100.0"
  band: "N395"
  filter_map_target: "u"
- physical_filter: "M411 DECam c0017 4112.0 264.0"
  band: "M411"
  filter_map_target: "g"
- physical_filter: "M438 DECam c0019 4380.0 260.0"
