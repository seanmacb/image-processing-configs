# S250830bp: the pilot event. These are the values the scripts in pilot/ hard-code,
# so this conf reproduces that run with too_run/. See too_run.conf.template for
# what each variable does.

EVENT=S250830bp

# Pilot templates used nights before 20250829 (day_obs<20250829).
EVENT_DATE=20250829

# Pilot template sky box: tracking_ra 315-335, tracking_dec -80 to -75.
RA_MIN=315
RA_MAX=335
DEC_MIN=-80
DEC_MAX=-75

# The 2025B DESGW ToO program. The archive returns DECam raws for it at
# (RA, Dec) ~ (327.7, -77.6) on 2025-09-05, i.e. inside the box above. The pilot
# nights were 20250831 20250905 20250913 20250924.
PROPID=2025B-485252

INJECTION_COLLECTION=u/smacbr/desgw/pilot/injection_catalog
