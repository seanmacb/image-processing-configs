# Medium/narrow-band dome flats of the July 2026 run (day_obs
# 20260710-20260711): 11 exposures per filter per night, from programs
# 2025B-589422 and 2025B-479281, all already in DECam/raw/all.
# M411/M517/N395/N540 science (2026A-271131) was taken on these nights.
#
# Certified from 2026-07-01 to 2026-11-01, where the 2025-26 bias in
# DECam/calib ends. Follows on from sets/2026-06.conf without overlap (M517 is
# in both).

SET=2026-07
BANDS="M411 M517 N395 N540"
DAY_OBS_MIN=20260710
DAY_OBS_MAX=20260711
CERT_BEGIN=2026-07-01T00:00:00
CERT_END=2026-11-01T00:00:00

# Sky frames: built by sets/sky-2026.conf for all medium bands at once;
# run_calib.sh refuses the sky steps here.
SKY_SUPERSEDED_BY=sky-2026
