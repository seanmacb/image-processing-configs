# Broad-band sky frames for the 19-20 flat era of DECam/calib (sky-only set:
# its flats are DESGW's, certified in DECam/calib for the same window). Built
# from up to SKY_MAX_EXPOSURES science exposures per filter of every program
# in DECam/raw/all, chosen by the sky_select step into sky-19-20.sky_exposures.
#
# BANDS are the bands fields/S250830bp has visits in this era: g 2, r 2, i 5,
# z 3 nights (466, 178, 549 and 69 available).
# Add bands if another field needs them.

SET=sky-19-20
SKY_ONLY=1
BANDS="g r i z"
DAY_OBS_MIN=20190101
DAY_OBS_MAX=20201231
CERT_BEGIN=2019-01-01T00:00:00
CERT_END=2020-12-31T23:59:59

# Sky-dominated exposures only, and a cap that keeps the ISR cost to roughly
# one step1 of 150 visits per filter.
SKY_MIN_EXPTIME=60
SKY_MAX_EXPOSURES=150
