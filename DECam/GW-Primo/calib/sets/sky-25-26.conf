# Broad-band sky frames for the 25-26 flat era of DECam/calib (sky-only set:
# its flats are DESGW's, certified in DECam/calib for the same window). Built
# from up to SKY_MAX_EXPOSURES science exposures per filter of every program
# in DECam/raw/all, chosen by the sky_select step into sky-25-26.sky_exposures.
#
# BANDS are the bands fields/S250830bp has visits in this era: g, r and z 4
# nights, i 6 (145, 312, 566 and 336 available, mostly a few repeatedly
# observed fields).
# Add bands if another field needs them.

SET=sky-25-26
SKY_ONLY=1
BANDS="g r i z"
DAY_OBS_MIN=20250101
DAY_OBS_MAX=20261031
CERT_BEGIN=2025-01-01T00:00:00
CERT_END=2026-11-01T00:00:00

# Sky-dominated exposures only, and a cap that keeps the ISR cost to roughly
# one step1 of 150 visits per filter.
SKY_MIN_EXPTIME=60
SKY_MAX_EXPOSURES=150
