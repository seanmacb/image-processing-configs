# Broad-band sky frames for the 23-24 flat era of DECam/calib (sky-only set:
# its flats are DESGW's, certified in DECam/calib for the same window). Built
# from up to SKY_MAX_EXPOSURES science exposures per filter of every program
# in DECam/raw/all, chosen by the sky_select step into sky-23-24.sky_exposures.
#
# BANDS are the bands fields/S250830bp has visits in this era: g 3, i 5, z 2
# nights (254, 510 and 429 available, most of them from a few repeatedly
# observed fields).
# Add bands if another field needs them.

SET=sky-23-24
SKY_ONLY=1
BANDS="g i z"
DAY_OBS_MIN=20230101
DAY_OBS_MAX=20241231
CERT_BEGIN=2023-01-01T00:00:00
CERT_END=2024-12-31T23:59:59

# Sky-dominated exposures only, and a cap that keeps the ISR cost to roughly
# one step1 of 150 visits per filter.
SKY_MIN_EXPTIME=60
SKY_MAX_EXPOSURES=150
