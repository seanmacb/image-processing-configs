# Broad-band sky frames for the 15-16 flat era of DECam/calib (sky-only set:
# its flats are DESGW's, certified in DECam/calib for the same window). Built
# from up to SKY_MAX_EXPOSURES science exposures per filter of every program
# in DECam/raw/all, chosen by the sky_select step into sky-15-16.sky_exposures.
#
# BANDS are the bands fields/S250830bp has visits in this era: g 4 nights, r 4
# nights (105 and 240 exposures of >= 60 s available).
# Add bands if another field needs them.

SET=sky-15-16
SKY_ONLY=1
BANDS="g r"
DAY_OBS_MIN=20150101
DAY_OBS_MAX=20161231
CERT_BEGIN=2015-01-01T00:00:00
CERT_END=2016-12-31T23:59:59

# Sky-dominated exposures only, and a cap that keeps the ISR cost to roughly
# one step1 of 150 visits per filter.
SKY_MIN_EXPTIME=60
SKY_MAX_EXPOSURES=150
