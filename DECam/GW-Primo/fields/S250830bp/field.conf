# GW-Primo field around the S250830bp localization: the medium-band
# follow-up of program 2026A-271131 (target GWPRIMO_S250830bp, nights
# 20260620-20260711), plus every archival g r i z visit of the same sky that
# DESGW ingested for its templates. See ../../run/field.conf.template for every
# variable.

FIELD=S250830bp

# Centre of the 2026A-271131 dithers (tracking RA 323.97-327.96, Dec
# -77.65 to -77.51). Radius 1 deg: the area with medium-band coverage at
# nearly full depth. Visits reaching it extend ~1 deg further.
REGION="CIRCLE(325.96, -77.58, 1.0)"

BANDS="g r i z N395 M411 M438 M464 M490 M517 N540"

# Some 2026A-271131 M490 exposures (66 in M490 against 48 in M438 and M464)
# are targeted GWPRIMO_test. Check what they are before deciding; to drop
# them:
# EXTRA_WHERE="visit.target_name != 'GWPRIMO_test'"

# The medium-band flats are not in DECam/calib: ../../calib/run_calib.sh
# builds them and certifies them into DECam/calib/GW-Primo (sets 2026-06 and
# 2026-07). That collection does not exist until the first certify, so
# 00_preflight.sh fails here until then; step0 can still run, it does not
# read it. Keep this fixed once step1 has run (the -i list of the output chain
# cannot change).
CALIB_COLLECTIONS=DECam/calib/GW-Primo

# skyCorr uses sky frames only when every filter and night has one (auto):
# ../../calib/sets/2026-06 and 2026-07 cover the medium bands, sky-15-16 to
# sky-25-26 the archival g r i z visits (2016-2025). Until all eight are
# certified, auto runs skyCorr without them. Decide before step2 first runs
# (see the template).
# SKY_FRAMES=auto
