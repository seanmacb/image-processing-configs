# GW-Primo field around the S250830bp localization: the medium-band
# follow-up of program 2026A-271131 (target GWPRIMO_S250830bp, nights
# 20260620-20260711), plus every archival g r i z visit of the same sky that
# DESGW ingested for its templates. See ../../run/field.conf.template for every
# variable.

FIELD=S250830bp

# Centre of the 2026A-271131 dithers (tracking RA 323.97-327.96, Dec
# -77.65 to -77.51). Radius 3 deg, deliberately generous: the medium-band
# coverage at nearly full depth is within ~1 deg, so the rest is margin, and
# step 3 builds coadds for every patch touching the circle. Visits reaching it
# extend ~1 deg further.
REGION="CIRCLE(325.96, -77.58, 3.0)"


BANDS="g r i z N395 M411 M438 M464 M490 M517 N540"
BANDS="g r i N395 M411 M438 M464 M490 M517 N540"

# M490 has 66 exposures against 48 in M438 and M464: 64 are targeted
# GWPRIMO_S250830bp and 2 GWPRIMO_test. To drop the two:
# EXTRA_WHERE="visit.target_name != 'GWPRIMO_test'"

# The medium-band flats are not in DECam/calib: ../../calib/run_calib.sh
# builds them and certifies them into DECam/calib/GW-Primo (sets 2026-06 and
# 2026-07; certified, and 00_preflight.sh finds them on every night). Keep this
# fixed once step1 has run (the -i list of the output chain cannot change).
CALIB_COLLECTIONS=DECam/calib/GW-Primo

# skyCorr runs WITHOUT sky frames (doSky false): the frames built by
# ../../calib/sets/sky-*.conf were not usable (sky-2026 N395: detector-to-
# detector offsets of several units and streaks, against ~0.001 expected), so
# the field is processed with the dome flats alone and skyCorr only fits the
# full-focal-plane background. `off` also keeps step2 from switching doSky on
# if sky frames are certified later. Set `auto` (every filter and night has a
# certified sky frame) or `on` to use them. Decide before step2 first runs: a
# later change needs a new OUTPUT_COLLECTION (see the template).
SKY_FRAMES=off
